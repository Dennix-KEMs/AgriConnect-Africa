<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Reset Password - AgriConnect Africa</title>

    <link rel="stylesheet" href="../css/style.css" />
  </head>

  <body class="auth-page">
    <main class="auth-card">
      <h1>Reset Password</h1>

      <p>Create a new password for your AgriConnect Africa account.</p>

      <form class="form-stack" id="reset-password-form">
        <input
          class="form-control"
          id="new-password"
          name="newPassword"
          type="password"
          placeholder="New Password"
          minlength="8"
          required
        />

        <input
          class="form-control"
          id="confirm-password"
          name="confirmPassword"
          type="password"
          placeholder="Confirm New Password"
          minlength="8"
          required
        />

        <small>
          Password must contain at least 8 characters, including uppercase,
          lowercase and a number.
        </small>

        <p class="form-message" id="reset-password-message" role="status"></p>

        <button class="btn btn-green" type="submit" id="reset-password-button">
          Reset Password
        </button>
      </form>

      <div class="auth-links">
        <a href="login.html"> ← Back to Login </a>
      </div>
    </main>

    <script src="../js/config.js"></script>

    <script src="../js/resetPassword.js"></script>
  </body>
</html>
