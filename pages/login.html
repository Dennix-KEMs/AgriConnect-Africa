<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Login - AgriConnect Africa</title>

    <link rel="stylesheet" href="../css/style.css" />
  </head>

  <body class="auth-page">
    <main class="auth-card">
      <h1>Login</h1>

      <p>Welcome back to AgriConnect Africa.</p>

      <form class="form-stack" id="login-form">
        <!-- EMAIL -->

        <input
          class="form-control"
          name="email"
          type="email"
          placeholder="Email Address"
          required
        />

        <!-- PASSWORD -->

        <div class="password-field">
          <input
            class="form-control"
            id="login-password"
            name="password"
            type="password"
            placeholder="Password"
            required
          />

          <button
            type="button"
            class="password-toggle"
            data-target="login-password"
            aria-label="Show password"
          >
            Show
          </button>
        </div>

        <!-- FORGOT PASSWORD -->

        <div class="forgot-password-link">
          <a href="forgot-password.html"> Forgot your password? </a>
        </div>

        <p class="form-message" id="login-message" role="status"></p>

        <button class="btn btn-green" type="submit">Login</button>
      </form>

      <div class="auth-links">
        <span> Don't have an account? </span>

        <a href="register.html"> Register Here </a>
      </div>
    </main>

    <script src="../js/config.js"></script>
    <script src="../js/login.js"></script>
  </body>
</html>
